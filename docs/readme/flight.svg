<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Las dependencias que te controlan durante el vuelo: Delivery, Ground, Torre, Salida, Centro, Aproximación, Torre y Ground del destino">
  <defs>
    <clipPath id="c"><rect width="1200" height="250" rx="16"/></clipPath>
    <path id="p" d="M11 0 L4 2 L-1 10 L-3 10 L-1 2 L-7 1.5 L-9 4 L-10.5 4 L-9.5 0 L-10.5 -4 L-9 -4 L-7 -1.5 L-1 -2 L-3 -10 L-1 -10 L4 -2 Z"/>
    <path id="prof" d="M70 170 H270 C330 170 350 70 430 70 H770 C850 70 870 170 930 170 H1130"/>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .s { animation: s 16s linear infinite; opacity: .35 }
      @keyframes s { 0%,11% { opacity: 1 } 13%,100% { opacity: .35 } }
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="250" fill="#0A121D"/>
    <!-- Perfil del vuelo -->
    <use href="#prof" fill="none" stroke="#1E2A3A" stroke-width="10" stroke-linecap="round"/>
    <use href="#prof" fill="none" stroke="#4CC2FF" stroke-width="1.6" stroke-dasharray="6 8" opacity=".8"/>
    <use href="#p" fill="#7BE3A6" transform="scale(1.5)">
      <animateMotion dur="16s" repeatCount="indefinite" rotate="auto"><mpath href="#prof"/></animateMotion>
    </use>
    <!-- Dependencias (cada una se enciende cuando el avión pasa) -->
    <g class="sans" font-size="15" font-weight="600" text-anchor="middle">
      <g class="s" style="animation-delay:0s"><circle cx="90" cy="170" r="5" fill="#7C5CE0"/><text x="90" y="205" fill="#C9B8FF">Delivery</text><text x="90" y="224" class="mono" font-size="11" font-weight="400" fill="#8A97A8">autorización IFR</text></g>
      <g class="s" style="animation-delay:2s"><circle cx="215" cy="170" r="5" fill="#F5A524"/><text x="215" y="205" fill="#FFD08A">Ground</text><text x="215" y="224" class="mono" font-size="11" font-weight="400" fill="#8A97A8">pushback · rodaje</text></g>
      <g class="s" style="animation-delay:3.6s"><circle cx="305" cy="150" r="5" fill="#3DDC84"/><text x="262" y="146" fill="#9EF0C2">Torre</text></g>
      <g class="s" style="animation-delay:4.8s"><circle cx="385" cy="85" r="5" fill="#4CC2FF"/><text x="330" y="80" fill="#A9E1FF">Salida</text></g>
      <g class="s" style="animation-delay:6.4s"><circle cx="600" cy="70" r="5" fill="#E6EDF5"/><text x="600" y="48" fill="#E6EDF5">Centro</text><text x="600" y="100" class="mono" font-size="11" font-weight="400" fill="#8A97A8">crucero · descenso por la STAR</text></g>
      <g class="s" style="animation-delay:9.6s"><circle cx="815" cy="85" r="5" fill="#4CC2FF"/><text x="892" y="80" fill="#A9E1FF">Aproximación</text></g>
      <g class="s" style="animation-delay:11.4s"><circle cx="895" cy="150" r="5" fill="#3DDC84"/><text x="945" y="140" fill="#9EF0C2">Torre</text></g>
      <g class="s" style="animation-delay:13s"><circle cx="1040" cy="170" r="5" fill="#F5A524"/><text x="1040" y="205" fill="#FFD08A">Ground</text><text x="1040" y="224" class="mono" font-size="11" font-weight="400" fill="#8A97A8">rodaje al puesto</text></g>
    </g>
    <rect x=".75" y=".75" width="1198.5" height="248.5" rx="16" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>
  </g>
</svg>

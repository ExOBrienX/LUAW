<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="LUAW: ATC y tráfico IA para Microsoft Flight Simulator 2024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070D17"/>
      <stop offset="1" stop-color="#0E1A2B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4CC2FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4CC2FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7BE3A6" stop-opacity="0"/>
      <stop offset="1" stop-color="#7BE3A6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6EDF5"/>
      <stop offset="1" stop-color="#4CC2FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1E2A3A" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="scope"><circle cx="930" cy="190" r="150"/></clipPath>
    <!-- Avión visto desde arriba, apuntando a +X (para animateMotion rotate="auto") -->
    <path id="plane" d="M11 0 L4 2 L-1 10 L-3 10 L-1 2 L-7 1.5 L-9 4 L-10.5 4 L-9.5 0 L-10.5 -4 L-9 -4 L-7 -1.5 L-1 -2 L-3 -10 L-1 -10 L4 -2 Z"/>
    <style>
      .mono { font-family: ui-monospace, "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
      .sans { font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
      .tag  { font-size: 11px; fill: #7BE3A6; }
      .dim  { fill: #8A97A8; }
      .blink { animation: blink 1.6s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .rise { opacity: 0; animation: rise 0.9s ease-out forwards; }
      .d1 { animation-delay: .25s } .d2 { animation-delay: .55s } .d3 { animation-delay: .85s } .d4 { animation-delay: 1.15s }
      .type { stroke-dasharray: 640; stroke-dashoffset: 640; animation: draw 2.2s 1.2s ease-out forwards; }
      @keyframes blink { 50% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes draw { to { stroke-dashoffset: 0 } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="930" cy="190" r="330" fill="url(#glow)"/>

    <!-- Pantalla de radar -->
    <g>
      <circle cx="930" cy="190" r="150" fill="#08111C" stroke="#1E2A3A" stroke-width="1.5"/>
      <g fill="none" stroke="#1F3A33" stroke-width="1">
        <circle cx="930" cy="190" r="50"/>
        <circle cx="930" cy="190" r="100"/>
        <path d="M780 190H1080M930 40V340" stroke-dasharray="3 6"/>
      </g>
      <g clip-path="url(#scope)">
        <!-- Barrido -->
        <g>
          <path d="M930 190 L930 40 A150 150 0 0 1 1036 84 Z" fill="url(#sweep)" opacity="0.5"/>
          <line x1="930" y1="190" x2="1036" y2="84" stroke="#7BE3A6" stroke-width="1.6" opacity="0.9"/>
          <animateTransform attributeName="transform" type="rotate" from="0 930 190" to="360 930 190" dur="6s" repeatCount="indefinite"/>
        </g>
        <!-- Pistas paralelas (verde llegadas, azul salidas) -->
        <g transform="rotate(-8 930 190)">
          <rect x="906" y="150" width="5" height="84" rx="1" fill="#5B8DEF"/>
          <rect x="950" y="140" width="5" height="84" rx="1" fill="#3DDC84"/>
        </g>
        <!-- Aproximación: STAR y final -->
        <path id="arr" d="M1090 60 C1040 70 1010 30 975 55 C955 70 960 100 958 138" fill="none" stroke="#4CC2FF" stroke-width="1.3" stroke-dasharray="5 5" opacity="0.7"/>
        <!-- Salida: SID -->
        <path id="dep" d="M904 232 C900 270 880 300 830 305 C800 308 780 290 770 262" fill="none" stroke="#7BE3A6" stroke-width="1.3" stroke-dasharray="5 5" opacity="0.6"/>
        <!-- Tráfico en ruta -->
        <path id="ovr" d="M770 120 L1090 250" fill="none" stroke="none"/>

        <g fill="#4CC2FF">
          <use href="#plane"><animateMotion dur="14s" repeatCount="indefinite" rotate="auto"><mpath href="#arr"/></animateMotion></use>
        </g>
        <g fill="#7BE3A6">
          <use href="#plane"><animateMotion dur="11s" begin="-3s" repeatCount="indefinite" rotate="auto"><mpath href="#dep"/></animateMotion></use>
        </g>
        <g fill="#F5A524">
          <use href="#plane" transform="scale(.8)"><animateMotion dur="22s" begin="-9s" repeatCount="indefinite" rotate="auto"><mpath href="#ovr"/></animateMotion></use>
        </g>
        <!-- Ecos -->
        <circle class="pulse" cx="872" cy="118" r="2.5" fill="#7BE3A6"/>
        <circle class="pulse" cx="1010" cy="262" r="2.5" fill="#7BE3A6" style="animation-delay:1.1s"/>
        <circle class="pulse" cx="842" cy="232" r="2.5" fill="#F5A524" style="animation-delay:.6s"/>
      </g>
      <!-- Etiquetas de vuelo -->
      <g class="mono tag">
        <text x="1000" y="52">LAN205</text><text x="1000" y="65" class="dim">090 ↓ 210</text>
        <text x="786" y="318">IBE6832</text><text x="786" y="331" class="dim">060 ↑ 250</text>
      </g>
      <g class="mono" font-size="10" fill="#5D6B7E">
        <text x="924" y="32">N</text><text x="1086" y="194">E</text><text x="924" y="358">S</text><text x="766" y="194">W</text>
      </g>
    </g>

    <!-- Texto -->
    <g class="sans">
      <g class="rise d1">
        <rect x="64" y="66" width="238" height="26" rx="13" fill="#0F2233" stroke="#1E3A52"/>
        <circle class="blink" cx="80" cy="79" r="4" fill="#3DDC84"/>
        <text x="92" y="83.5" class="mono" font-size="12" fill="#9FD8FF" letter-spacing="1.2">MSFS 2024 · BETA</text>
      </g>
      <text class="rise d2" x="60" y="172" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="-2">LUAW</text>
      <text class="rise d2 mono" x="362" y="166" font-size="17" font-weight="700" fill="#9FD8FF" letter-spacing="5">LINE UP AND WAIT</text>
      <path class="type" d="M64 192 H700" stroke="#4CC2FF" stroke-width="2" opacity="0.5"/>
      <text class="rise d3" x="64" y="232" font-size="23" fill="#C9D4E2">Control aéreo y tráfico IA con vida propia,</text>
      <text class="rise d3" x="64" y="262" font-size="23" fill="#C9D4E2">de puesto a puesto, en cualquier aeropuerto.</text>
      <g class="rise d4 mono" font-size="13">
        <rect x="64" y="292" width="126" height="30" rx="8" fill="#0F1B2A" stroke="#1E2A3A"/><text x="80" y="312" fill="#7BE3A6">C# · .NET 10</text>
        <rect x="200" y="292" width="100" height="30" rx="8" fill="#0F1B2A" stroke="#1E2A3A"/><text x="216" y="312" fill="#4CC2FF">Avalonia</text>
        <rect x="310" y="292" width="118" height="30" rx="8" fill="#0F1B2A" stroke="#1E2A3A"/><text x="326" y="312" fill="#F5A524">SimConnect</text>
        <rect x="438" y="292" width="160" height="30" rx="8" fill="#0F1B2A" stroke="#1E2A3A"/><text x="454" y="312" fill="#C9D4E2">voz local en CPU</text>
      </g>
    </g>
    <rect x="0.75" y="0.75" width="1198.5" height="378.5" rx="18" fill="none" stroke="#1E2A3A" stroke-width="1.5"/>
  </g>
</svg>
